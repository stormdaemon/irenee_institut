services:
  database:
    image: postgres:17-alpine
    container_name: apostolos-database
    restart: unless-stopped
    env_file: /opt/apostolos/secrets/database.env
    volumes:
      - apostolos-postgres:/var/lib/postgresql/data
    networks: [apostolos]
    mem_limit: 320m
    cpus: 0.50
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d apostolos"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  app:
    image: apostolos:${APOSTOLOS_RELEASE:?An explicit release is required}
    container_name: apostolos-app
    restart: unless-stopped
    env_file: /opt/apostolos/secrets/application.env
    ports: ['127.0.0.1:3031:3000']
    volumes:
      - apostolos-avatars:/app/avatars
    networks: [apostolos]
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 640m
    cpus: 1.0
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  apostolos:
    name: apostolos
volumes:
  apostolos-postgres:
    name: apostolos-postgres
  apostolos-avatars:
    name: apostolos-avatars
