server {
    listen 80;
    listen [::]:80;
    server_name apostolos-saint-irenee.duckdns.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/apostolos-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apostolos-saint-irenee.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/apostolos-saint-irenee.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apostolos-saint-irenee.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ApostolosTLS:1m;
    client_max_body_size 12m;
    # Persistent Search Console ownership proof, independent of app releases.
    location = /googleadf6310bf348fd7a.html {
        root /var/www/apostolos-verification;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
