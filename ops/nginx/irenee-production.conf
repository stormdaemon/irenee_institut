server {
    listen 80;
    listen [::]:80;
    server_name irenee-institut.org www.irenee-institut.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://irenee-institut.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.irenee-institut.org;

    ssl_certificate /etc/letsencrypt/live/irenee-institut.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irenee-institut.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://irenee-institut.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irenee-institut.org;

    client_max_body_size 4m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    ssl_certificate /etc/letsencrypt/live/irenee-institut.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irenee-institut.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    error_page 502 503 504 @irenee_maintenance;

    location ~ /\. {
        deny all;
    }

    location = /maintenance-logo.png {
        alias /srv/irenee-current/public/images/logo_without_text.png;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @irenee_maintenance {
        internal;
        root /var/www/irenee-maintenance;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =503;
    }

    location /videos/ {
        alias /srv/irenee-current/public/videos/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_next/static/ {
        alias /srv/irenee-current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/auth/login {
        limit_req zone=irenee_auth burst=10 nodelay;
        limit_conn irenee_connections 10;
        include /etc/nginx/snippets/irenee-proxy.conf;
    }

    location = /api/auth/signup {
        limit_req zone=irenee_auth burst=5 nodelay;
        limit_conn irenee_connections 10;
        include /etc/nginx/snippets/irenee-proxy.conf;
    }

    location = /api/auth/verification/resend {
        limit_req zone=irenee_auth burst=5 nodelay;
        limit_conn irenee_connections 10;
        include /etc/nginx/snippets/irenee-proxy.conf;
    }

    location / {
        limit_req zone=irenee_general burst=60 nodelay;
        limit_conn irenee_connections 30;
        include /etc/nginx/snippets/irenee-proxy.conf;
    }
}
