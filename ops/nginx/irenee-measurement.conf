# HTTP-context include. Counts requests, never individual visitors.
# No IP, cookie, query string, raw referrer, token or user identifier.
map $uri $irenee_measurement_path {
    default "";
    / /;
    ~^/(blog|formations|institut-apologetique|ecole-apologetique-en-ligne|programme-apologetique|choisir-formation-apologetique|ressources-apologetique|bibliotheque-apologetique|equipe|a-propos|contact|inscription)$ $uri;
    ~^/blog/[a-z0-9-]+$ $uri;
    ~^/direct/ /direct;
    /api/auth/signup /registration;
    /api/payments/checkout /checkout;
    /api/payments/stripe/reconcile /payment-confirmation;
}
map $http_referer $irenee_measurement_source {
    default external;
    "" direct_or_unknown;
    ~*^https?://(www\.)?irenee-institut\.org(/|$) internal;
    ~*^https?://([a-z0-9-]+\.)?google\.[a-z.]+(/|$) google;
    ~*^https?://([a-z0-9-]+\.)?bing\.com(/|$) bing;
    ~*^https?://([a-z0-9-]+\.)?(youtube\.com|youtu\.be)(/|$) youtube;
    ~*^https?://([a-z0-9-]+\.)?facebook\.com(/|$) facebook;
    ~*^https?://([a-z0-9-]+\.)?(whatsapp\.com|wa\.me)(/|$) whatsapp;
}
map $http_user_agent $irenee_measurement_agent {
    default desktop;
    ~*(bot|crawler|spider|headless|curl|python|wget|scanner|audit) bot;
    ~*(Mobile|Android|iPhone|iPad) mobile;
}
map "$irenee_measurement_path:$http_rsc:$http_next_router_prefetch:$http_purpose" $irenee_measurement_enabled {
    default 0;
    ~^/[^:]*:::$ 1;
}
log_format irenee_measurement escape=json '{"time":"$time_iso8601","path":"$irenee_measurement_path","method":"$request_method","status":$status,"source":"$irenee_measurement_source","agent":"$irenee_measurement_agent","seconds":$request_time}';
