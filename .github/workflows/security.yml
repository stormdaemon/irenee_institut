name: Security and quality gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: irenee_security_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irenee_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUDIT_LOG_PEPPER: ci-audit-pepper-with-at-least-thirty-two-characters
      AUTH_COOKIE_SECURE: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/irenee_security_test
      LOCAL_AUTH_JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      NEXT_TELEMETRY_DISABLED: "1"
      RATE_LIMIT_PEPPER: ci-rate-pepper-with-at-least-thirty-two-characters
      SETTINGS_ENCRYPTION_KEY: WlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlo=
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/irenee_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Initialize isolated test database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -v runtime_password=isolated-ci-runtime-only -f ops/postgres/create-runtime-role.sql
      - run: bun audit
      - run: bunx tsc --noEmit
      - name: HTTP API happy/sad paths and strict 100 percent coverage
        run: bun run test:api
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-api-coverage
          path: coverage/
          retention-days: 14
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Course experience visual QA (Chromium)
        env:
          E2E_SKIP_BUILD: "true"
        run: bun run test:e2e --project=chromium --retries=0
      - name: Generate reviewable Apostolos visual reference candidates
        if: failure()
        env:
          E2E_SKIP_BUILD: "true"
        run: bun run test:e2e --project=chromium --retries=0 --update-snapshots=all e2e/course-experience.visual.spec.ts
      - name: Upload visual reference candidates for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apostolos-visual-reference-candidates
          path: e2e/__screenshots__
          retention-days: 7
      - if: github.event_name == 'schedule'
        run: bunx playwright install --with-deps webkit
      - if: github.event_name == 'schedule'
        name: Course experience mobile QA (WebKit)
        env:
          E2E_SKIP_BUILD: "true"
          E2E_WEBKIT: "true"
        run: bun run test:e2e --project=webkit-iphone
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-course-experience-${{ github.run_attempt }}
          path: .playwright-artifacts
          include-hidden-files: true
          retention-days: 7

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
